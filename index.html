<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>supervidrios</title>

    <!--Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!--Bootstrap icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">

    <!--CSS-->
    <!--<link rel="stylesheet" href="supervidrios2.css">-->
    <link rel="stylesheet" href="home2.css">

    
    
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <a href="#">
                <img src="logosimbol.svg" alt="Logo simbolo">
            </a>
        </div>
        <nav class="sidebar-nav">
            <!--01-->
            <div class="step-group">
                <button class="step active" type="button" onclick="toggleMenu('menu01' , this)">
                    <span>01</span>
                </button>
                <div class="step-submenu" id="menu01">
                    <a href="">Dashboard</a>
                    <a href="">Resumen de ventas</a>
                    <a href="">Indicadores</a>
                </div>
            </div>
            <!--02-->
            <div class="step-group">
                <button class="step" type="button" onclick="toggleMenu('menu02' , this)">
                    <span>02</span>
                </button>
                <div class="step-submenu" id="menu02">
                    <a href="">Clientes</a>
                    <a href="">Registro de clientes</a>
                    <a href="">Listado de clientes</a>
                </div>
            </div>
            <!--03-->
            <div class="step-group">
                <button class="step" type="button" onclick="toggleMenu('menu03' , this)">
                    <span>03</span>
                </button>
                <div class="step-submenu" id="menu03">
                    <a href="">Ventas</a>
                    <a href="">Nueva venta</a>
                    <a href="">Cotizaciones</a>
                    <a href="">Facturas</a>
                </div>
            </div>
            <!--04-->
            <div class="step-group">
                <button class="step" type="button" onclick="toggleMenu('menu04' , this)">
                    <span>04</span>
                </button>
                <div class="step-submenu" id="menu04">
                    <a href="">Inventario</a>
                    <a href="">Productos</a>
                    <a href="">Entradas</a>
                    <a href="">Salidas</a>
                </div>
            </div>
            <!--05-->
            <div class="step-group">
                <button class="step" type="button" onclick="toggleMenu('menu05' , this)">
                    <span>05</span>
                </button>
                <div class="step-submenu" id="menu05">
                    <a href="">Configuración</a>
                    <a href="">Usuarios</a>
                    <a href="">Perfil</a>
                </div>
            </div>
        </nav>
    </aside>

    <main class="main-content">

        <!--Header-->
        <header class="header">
            <div class="container-fluid">
                <div class="row align-items-center">
                    <!--Logo-->
                    <div class="col-lg-3">
                        <a href="#" class="logo-text">
                            <img src="logotext.svg" alt="Logo supervidrios" class="logo-svg">
                        </a>
                    </div>
                     <!--Menu-->
                    <div class="col-lg-6">
                        <ul class="menu">
                            <li>
                                <a href="#">Home</a>
                            </li>
                            <li>
                                <a href="#">History</a>
                            </li>
                            <li>
                                <a href="#">Service</a>
                            </li>
                            <li>
                                <a href="#">Contacts</a>
                            </li>
                        </ul>
                    </div>

                    <!--Icons-->
                    <div class="col-lg-3">
                        <div class="d-flex align-items-center nav-icons">
                            <i class="bi bi-search"></i>
                            <i class="bi bi-bell"></i>
                            <i class="bi bi-chat"></i>
                            <i class="bi bi-wifi text-success"></i>
                            <img src="https://i.pravatar.cc/40" alt="foto de perfil" class="avatar mx-2">
                            <button class="btn btn-today">Today</button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!--Contenido-->
        <div class="container-fluid">
            <div class="main-container">
                <h1>Aquí va el contenido</h1>
            </div>
        </div>
    </main>


<script>
    function toggleMenu(menuId, button) {

    const menu = document.getElementById(menuId);

    // Cerrar todos los submenus
    document.querySelectorAll('.step-submenu').forEach(item => {

        if (item.id !== menuId) {
            item.classList.remove('show');
        }

    });


    // Quitar activo de todos los botones
    document.querySelectorAll('.step').forEach(item => {
        item.classList.remove('active');
    });


    // Abrir/cerrar el seleccionado
    menu.classList.toggle('show');

    // Activar botón
    button.classList.add('active');
}
</script>    
</body>
</html>
